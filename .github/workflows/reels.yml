name: Reels Instagram

on:
  workflow_dispatch:
    inputs:
      lenguaje:
        description: 'Lenguaje (aleatorio o un id del catálogo: javascript, python, ...)'
        required: false
        default: 'aleatorio'
        type: string
      cantidad:
        description: 'Número de reels a publicar (1-5)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
  schedule:
    # Todos los dias a las 13:00 UTC (publica 1 reel aleatorio).
    - cron: '0 13 * * *'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
      LENGUAJE: ${{ inputs.lenguaje || 'aleatorio' }}
      CANTIDAD: ${{ inputs.cantidad || '1' }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Activar Corepack
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generar reels (solo local en PR)
        if: github.event_name == 'pull_request'
        run: yarn node scripts/reels/index.mjs --solo-local

      - name: Generar y publicar reels
        if: github.event_name != 'pull_request'
        run: yarn node scripts/reels/index.mjs
